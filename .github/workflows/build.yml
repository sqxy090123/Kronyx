name: Build Kronyx

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        cmake_build_type: [Release, Debug]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libglfw3-dev libglm-dev libx11-dev libxi-dev libxrandr-dev libgl1-mesa-dev

    - name: Configure CMake
      run: |
        cmake -S ${{ github.workspace }} -B ${{ github.workspace }}/build -DCMAKE_BUILD_TYPE=${{ matrix.cmake_build_type }} -DKYR_BUILD_TESTS=ON
        echo "Configure exit code: $?"

    - name: Build
      run: |
        cmake --build ${{ github.workspace }}/build -j2 2>&1 | tail -50
        echo "Build exit code: ${PIPESTATUS[0]}"

    - name: Run tests
      working-directory: ${{ github.workspace }}/build
      run: |
        echo "Available executables:"
        ls -la *.exe 2>/dev/null || ls -la *test* 2>/dev/null || echo "No test executables found"
        echo "Running tests..."
        ctest --output-on-failure || exit_code=$?
        if [ "${exit_code:-0}" != "0" ]; then
          echo "ctest failed with exit code ${exit_code:-unknown}"
        fi

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kronyx-build-${{ matrix.os }}-${{ matrix.cmake_build_type }}
        path: |
          ${{ github.workspace }}/build/ky_test_*.exe
          ${{ github.workspace }}/build/ky_test_*
          ${{ github.workspace }}/build/libky_*.a
          ${{ github.workspace }}/build/libky_*.lib
        if-no-files-found: warn
