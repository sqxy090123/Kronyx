name: Build Kronyx

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        cmake_build_type: [Release, Debug]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Enable long paths on Windows
      if: runner.os == 'Windows'
      run: |
        git config --system core.longpaths true
        [Environment]::SetEnvironmentVariable("GIT_CONFIG_SYSTEM", "$env:USERPROFILE\.gitconfig", "Machine")

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libglfw3-dev libglm-dev libx11-dev libxi-dev libxrandr-dev libgl1-mesa-dev libssl-dev

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install glfw openssl
        echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl)" >> "$GITHUB_ENV"

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        # Install vcpkg
        git clone https://github.com/microsoft/vcpkg.git $env:USERPROFILE\vcpkg
        cd $env:USERPROFILE\vcpkg
        .\bootstrap-vcpkg.bat
        $vcpkgDir = (Get-Location).Path
        "VCPKG_ROOT=$vcpkgDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "OPENSSL_ROOT_DIR=$vcpkgDir\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "VCPKG_TARGET_TRIPLET=x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        Write-Host "vcpkg root: $vcpkgDir"

    - name: Install vcpkg packages (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        & "$env:VCPKG_ROOT\vcpkg.exe" install glfw3:x64-windows
        & "$env:VCPKG_ROOT\vcpkg.exe" install openssl:x64-windows

    - name: Configure CMake (Linux/Mac)
      if: runner.os != 'Windows'
      run: |
        cmake -S ${{ github.workspace }} -B ${{ github.workspace }}/build \
          -DCMAKE_BUILD_TYPE=${{ matrix.cmake_build_type }} \
          -DKYR_BUILD_TESTS=ON \
          -DCMAKE_PREFIX_PATH="$(brew --prefix openssl 2>/dev/null || echo /usr/local/opt/openssl)"

    - name: Configure CMake (Windows + vcpkg)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $toolchain = Join-Path $env:VCPKG_ROOT "scripts\buildsystems\vcpkg.cmake"
        $buildDir = Join-Path ${{ github.workspace }} "build"
        cmake -S ${{ github.workspace }} -B $buildDir `
          -DCMAKE_BUILD_TYPE=${{ matrix.cmake_build_type }} `
          -DKYR_BUILD_TESTS=ON `
          -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
          -DVCPKG_TARGET_TRIPLET=x64-windows

    - name: Build
      run: |
        cmake --build ${{ github.workspace }}/build -j2

    - name: Run tests
      working-directory: ${{ github.workspace }}/build
      shell: bash
      run: |
        set -x
        echo "=== Checking test executables ==="
        ls -la ky_test_* 2>&1 || echo "No ky_test_* files found"
        echo "=== Running individual tests ==="
        for test in ky_test_core ky_test_math ky_test_ecs ky_test_render ky_test_physics ky_test_script; do
          if [ -f "$test" ]; then
            echo "Running $test..."
            ./$test
            result=$?
            echo "$test exit code: $result"
            if [ $result -ne 0 ]; then
              echo "FAILED: $test"
              exit $result
            fi
          else
            echo "NOT FOUND: $test"
          fi
        done
        echo "=== All tests passed ==="

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kronyx-build-${{ matrix.os }}-${{ matrix.cmake_build_type }}
        path: |
          ${{ github.workspace }}/build/ky_test_*.exe
          ${{ github.workspace }}/build/ky_test_*
          ${{ github.workspace }}/build/libky_*.a
          ${{ github.workspace }}/build/libky_*.lib
        if-no-files-found: warn
