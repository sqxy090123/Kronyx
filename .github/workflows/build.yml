name: Build Kronyx

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        cmake_build_type: [Release, Debug]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Enable long paths on Windows
      if: runner.os == 'Windows'
      run: |
        git config --system core.longpaths true
        [Environment]::SetEnvironmentVariable("GIT_CONFIG_SYSTEM", "$env:USERPROFILE\.gitconfig", "Machine")

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libglfw3-dev libglm-dev libx11-dev libxi-dev libxrandr-dev libgl1-mesa-dev

    - name: Configure CMake
      run: |
        cmake -S ${{ github.workspace }} -B ${{ github.workspace }}/build -DCMAKE_BUILD_TYPE=${{ matrix.cmake_build_type }} -DKYR_BUILD_TESTS=ON
        echo "Configure exit code: $?"

    - name: Build
      run: |
        cmake --build ${{ github.workspace }}/build -j2 2>&1 | tail -50
        echo "Build exit code: ${PIPESTATUS[0]}"

    - name: Run tests
      working-directory: ${{ github.workspace }}/build
      shell: bash
      run: |
        set -x
        echo "=== Checking test executables ==="
        ls -la ky_test_* 2>&1 || echo "No ky_test_* files found"
        echo "=== Running individual tests ==="
        for test in ky_test_core ky_test_math ky_test_ecs ky_test_render ky_test_physics ky_test_script; do
          if [ -f "$test" ]; then
            echo "Running $test..."
            ./$test
            result=$?
            echo "$test exit code: $result"
            if [ $result -ne 0 ]; then
              echo "FAILED: $test"
              exit $result
            fi
          else
            echo "NOT FOUND: $test"
          fi
        done
        echo "=== All tests passed ==="

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kronyx-build-${{ matrix.os }}-${{ matrix.cmake_build_type }}
        path: |
          ${{ github.workspace }}/build/ky_test_*.exe
          ${{ github.workspace }}/build/ky_test_*
          ${{ github.workspace }}/build/libky_*.a
          ${{ github.workspace }}/build/libky_*.lib
        if-no-files-found: warn
