name: Build Kronyx

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        cmake_build_type: [Release, Debug]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libglfw3-dev libglm-dev libx11-dev libxi-dev libxrandr-dev libgl1-mesa-dev

    - name: Configure CMake
      run: |
        cmake -S ${{ github.workspace }} -B ${{ github.workspace }}/build -DCMAKE_BUILD_TYPE=${{ matrix.cmake_build_type }} -DKYR_BUILD_TESTS=ON
        echo "Configure exit code: $?"

    - name: Build
      run: |
        cmake --build ${{ github.workspace }}/build -j2
        echo "Build exit code: $?"

    - name: Run tests
      working-directory: ${{ github.workspace }}/build
      run: |
        echo "Running individual tests..."
        for test in ky_test_core ky_test_math ky_test_ecs ky_test_render ky_test_physics ky_test_script; do
          if [ -f "$test" ]; then
            echo "Running $test..."
            ./$test || exit_code=$?
            if [ "$exit_code" != "0" ]; then
              echo "Test $test failed with exit code $exit_code"
              exit $exit_code
            fi
          else
            echo "Test $test not found"
          fi
        done
        echo "All tests passed!"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kronyx-build-${{ matrix.os }}-${{ matrix.cmake_build_type }}
        path: |
          ${{ github.workspace }}/build/ky_test_*
          ${{ github.workspace }}/build/libky_*.a
          ${{ github.workspace }}/build/libky_*.lib
