name: Build Kronyx

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        cmake_build_type: [Release, Debug]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libglfw3-dev libglm-dev libx11-dev libxi-dev libxrandr-dev libgl1-mesa-dev

    - name: Configure CMake
      run: cmake -S ${{ github.workspace }} -B ${{ github.workspace }}/build -DCMAKE_BUILD_TYPE=${{ matrix.cmake_build_type }} -DKYR_BUILD_TESTS=ON

    - name: Show CMake info
      run: |
        cmake --version
        cmake -L ${{ github.workspace }}/build
        echo "Generator: $(cmake --no-warn-unused-cli ${{ github.workspace }}/build -G 2>&1 || true)"
        where cmake 2>/dev/null || which cmake
        where cl 2>/dev/null || which gcc || which clang 2>/dev/null || echo "No C compiler found"

    - name: Build
      run: |
        cmake --build ${{ github.workspace }}/build -j2 2>&1 | tee build.log
        echo "Build exit code: ${PIPESTATUS[0]}"
      continue-on-error: true

    - name: Show build log on failure
      if: failure()
      run: |
        cat ${{ github.workspace }}/build/build.log || true
        echo "Exit code was: $?"

    - name: Run tests
      working-directory: ${{ github.workspace }}/build
      run: ctest --output-on-failure --verbose

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kronyx-build-${{ matrix.os }}-${{ matrix.cmake_build_type }}
        path: |
          ${{ github.workspace }}/build/ky_test_*
          ${{ github.workspace }}/build/libky_*.a
          ${{ github.workspace }}/build/libky_*.lib
