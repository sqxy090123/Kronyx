name: Build Kronyx

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        cmake_build_type: [Release, Debug]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Enable long paths on Windows
      if: runner.os == 'Windows'
      run: |
        git config --system core.longpaths true
        [Environment]::SetEnvironmentVariable("GIT_CONFIG_SYSTEM", "$env:USERPROFILE\.gitconfig", "Machine")

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libglfw3-dev libglm-dev libx11-dev libxi-dev libxrandr-dev libgl1-mesa-dev libssl-dev

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install glfw openssl
        echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl)" >> "$GITHUB_ENV"

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        # Install vcpkg
        git clone https://github.com/microsoft/vcpkg.git $env:USERPROFILE\vcpkg
        cd $env:USERPROFILE\vcpkg
        .\bootstrap-vcpkg.bat
        $vcpkgDir = (Get-Location).Path
        "VCPKG_ROOT=$vcpkgDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "OPENSSL_ROOT_DIR=$vcpkgDir\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "VCPKG_TARGET_TRIPLET=x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        Write-Host "vcpkg root: $vcpkgDir"

    - name: Install vcpkg packages (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        & "$env:VCPKG_ROOT\vcpkg.exe" install glfw3:x64-windows
        & "$env:VCPKG_ROOT\vcpkg.exe" install openssl:x64-windows

    - name: Configure CMake (Linux/Mac)
      if: runner.os != 'Windows'
      run: |
        cmake -S ${{ github.workspace }} -B ${{ github.workspace }}/build \
          -DCMAKE_BUILD_TYPE=${{ matrix.cmake_build_type }} \
          -DKYR_BUILD_TESTS=ON \
          -DCMAKE_PREFIX_PATH="$(brew --prefix openssl 2>/dev/null || echo /usr/local/opt/openssl)"

    - name: Configure CMake (Windows + vcpkg)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $toolchain = Join-Path $env:VCPKG_ROOT "scripts\buildsystems\vcpkg.cmake"
        $buildDir = Join-Path ${{ github.workspace }} "build"
        cmake -S ${{ github.workspace }} -B $buildDir `
          -DCMAKE_BUILD_TYPE=${{ matrix.cmake_build_type }} `
          -DKYR_BUILD_TESTS=ON `
          -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
          -DVCPKG_TARGET_TRIPLET=x64-windows

    - name: Build
      run: |
        cmake --build ${{ github.workspace }}/build -j2

    - name: Run tests
      working-directory: ${{ github.workspace }}/build
      shell: bash
      run: |
        set -x
        # Determine where the test executables live.
        # - Linux/macOS use the single-config Unix Makefile generator: binaries in build/.
        # - Windows uses the Visual Studio multi-config generator: binaries in build/<Config>/.
        if [ "${{ runner.os }}" = "Windows" ]; then
          BIN_DIR="${{ matrix.cmake_build_type }}"
          SFX=".exe"
        else
          BIN_DIR="."
          SFX=""
        fi
        cd "$BIN_DIR" || { echo "CWD missing: $BIN_DIR"; exit 1; }
        echo "=== Running tests from: $(pwd)  (sfx='${SFX}') ==="

        tests=(
          ky_test_core
          ky_test_math
          ky_test_ecs
          ky_test_render
          ky_test_physics
          ky_test_script
          ky_test_pack
          ky_test_2d
          ky_test_hooks
          ky_test_event
          ky_test_anti_tamper
          ky_test_input
          ky_test_demo_loop
          ky_test_resource_flow
          ky_test_kyx_bindings
          ky_test_kyx_gc
          ky_test_editor_world
          ky_test_scene_serialize
          ky_test_spritesheet
          ky_test_extreme
        )

        fail=0
        for t in "${tests[@]}"; do
          bin="${t}${SFX}"
          if [ ! -f "$bin" ]; then
            echo "NOT FOUND: $bin"
            fail=1
            continue
          fi
          echo "Running $bin..."
          ./"$bin"
          rc=$?
          echo "$bin exit code: $rc"
          if [ $rc -ne 0 ]; then
            echo "FAILED: $bin"
            fail=1
          fi
        done
        echo "=== Test run summary (fail=$fail) ==="
        if [ $fail -ne 0 ]; then
          exit $fail
        fi
        echo "=== All tests passed ==="

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kronyx-build-${{ matrix.os }}-${{ matrix.cmake_build_type }}
        path: |
          ${{ github.workspace }}/build/ky_test_*.exe
          ${{ github.workspace }}/build/ky_test_*
          ${{ github.workspace }}/build/libky_*.a
          ${{ github.workspace }}/build/libky_*.lib
        if-no-files-found: warn
